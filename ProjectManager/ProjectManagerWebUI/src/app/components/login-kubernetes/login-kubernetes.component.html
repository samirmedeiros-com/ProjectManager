<div class="login-container">
  <div class="login-box">
    <div class="logo-container">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#326CE5"
           stroke-width="1.4" stroke-linejoin="round" class="logo">
        <path d="M12 2.2l8.4 4v7.6L12 21.8 3.6 13.8V6.2z"/>
        <circle cx="12" cy="12" r="3"/>
        <path d="M12 5.4V9M12 15v3.6M6.6 8.6L9.6 10.6M14.4 13.4l3 2M6.6 15.4l3-2M14.4 10.6l3-2"/>
      </svg>
    </div>

    <h1>Gestão Kubernetes</h1>
    <p>Aceda com as credenciais desta aplicação</p>

    @if (aviso) {
      <div class="alert alert-aviso">{{ aviso }}</div>
    }

    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" class="form-control" autocomplete="username"
               [(ngModel)]="form.email" [class.is-invalid]="submitted && !form.email" />
        @if (submitted && !form.email) {
          <div class="invalid-feedback">Email é obrigatório</div>
        }
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" class="form-control" autocomplete="current-password"
               [(ngModel)]="form.password" [class.is-invalid]="submitted && !form.password"
               (keyup.enter)="onSubmit()" />
        @if (submitted && !form.password) {
          <div class="invalid-feedback">Password é obrigatória</div>
        }
      </div>

      @if (erro) {
        <div class="alert alert-danger">{{ erro }}</div>
      }

      <button type="submit" class="btn btn-primary" [disabled]="loading">
        @if (loading) { <span class="spinner"></span> }
        Entrar
      </button>
    </form>

    <div class="back-link">
      <a href="javascript:void(0)" (click)="voltar()">Voltar ao Portal DPD</a>
    </div>
  </div>
</div>
